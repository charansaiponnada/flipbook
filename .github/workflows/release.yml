name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: npm install
      - run: npm run tauri -- icon app-icon.png
      - name: Build
        run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: Flipbook-windows
          path: |
            src-tauri/target/release/flipbook.exe
            src-tauri/target/release/bundle/nsis/*.exe
      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes || true
          cp src-tauri/target/release/flipbook.exe Flipbook-portable.exe
          gh release upload "${{ github.ref_name }}" Flipbook-portable.exe src-tauri/target/release/bundle/nsis/*.exe --clobber
