name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release
      - name: Build installer
        shell: bash
        run: |
          command -v makensis || choco install nsis -y --no-progress
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          makensis -DVERSION="$VERSION" assets/windows/installer.nsi
          cp "target/release/Flipbook-$VERSION-setup.exe" Flipbook-setup.exe
          cp target/release/flipbook.exe Flipbook-portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Flipbook-windows
          path: |
            Flipbook-setup.exe
            Flipbook-portable.exe
      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --generate-notes || true
          gh release upload "${{ github.ref_name }}" Flipbook-setup.exe Flipbook-portable.exe --clobber
