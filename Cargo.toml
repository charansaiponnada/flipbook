[package]
name = "flipbook"
version = "0.4.0"
description = "Open any PDF as a real page-turning book"
edition = "2021"
license = "MIT"
authors = ["Charan Sai Ponnada"]

[dependencies]
gpui = "0.2.2"
hayro = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
ureq = { version = "3.5.2", features = ["json"] }
sha2 = "0.11.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
# no panic = "abort": pdf.rs catches panics from malformed PDFs instead of crashing

# PDF rasterising is unusably slow unoptimised
[profile.dev.package."*"]
opt-level = 2
