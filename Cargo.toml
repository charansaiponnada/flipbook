[package]
name = "flipbook"
version = "0.2.0"
description = "Open any PDF as a real page-turning book"
edition = "2021"
license = "MIT"

[dependencies]
gpui = "0.2.2"
hayro = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
# no panic = "abort": pdf.rs catches panics from malformed PDFs instead of crashing

# PDF rasterising is unusably slow unoptimised
[profile.dev.package."*"]
opt-level = 2
